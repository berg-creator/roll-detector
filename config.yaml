# Параметры управляющей программы. Любой можно переопределить из командной строки.

model:
  weights: models/roll_yolo11n_openvino_model  # OpenVINO: ~27 мс/кадр на 2 vCPU (.pt - ~55 мс)
  conf: 0.5          # минимальная уверенность детекции
  imgsz: 480         # размер входа, как при обучении

zone:
  x_max: 0.4         # X: граница зоны выхода, доля ширины кадра (ролик левее нее)
  y_min: 0.35        # зона по высоте - отсекает складские ролики у дальней стены
  y_max: 1.0
  min_overlap: 0.25  # какая доля рамки ролика должна лежать в зоне

relay:
  lock_after: 3.0    # Y, с: ролик в зоне столько времени -> блокировка
  unlock_after: 5.0  # Z, с: зона пуста столько времени -> разблокировка
  gap_tolerance: 0.3 # с: пропуски детекции короче этого не сбрасывают отсчет Y
  start_locked: true # при старте реле заблокировано, пока не убедимся, что зона пуста

camera:
  fps: 20            # для видеофайлов: с какой частотой брать кадры (как у камеры)
  timeout: 1.0       # с без кадров -> аварийная блокировка
